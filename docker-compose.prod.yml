services:
  db:
    image: postgres:15-alpine
    container_name: servicehub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - servicehub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - servicehub_network

  backend:
    build:
      context: ./backend-stem
      dockerfile: Dockerfile
    container_name: servicehub_backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - servicehub_uploads_data:/app/uploads
    command: >
      sh -c "alembic upgrade head && gunicorn main:app -w 3 -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - servicehub_network

  frontend:
    build:
      context: ./frontend-stem
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: servicehub_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - servicehub_network

  nginx-proxy:
    image: jc21/nginx-proxy-manager:2.12.6
    container_name: servicehub_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - ./nginx-proxy/data:/data
      - ./nginx-proxy/letsencrypt:/etc/letsencrypt
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - servicehub_network

volumes:
  servicehub_postgres_data:
    name: servicehub_postgres_data
    driver: local
  servicehub_uploads_data:
    name: servicehub_uploads_data
    driver: local

networks:
  servicehub_network:
    driver: bridge
