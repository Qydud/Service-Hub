name: ServiceHub CI

on:
  push:
    branches: [ Miras ]
  pull_request:
    branches: [ Miras ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend-stem/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend-stem

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-stem/package.json

      - name: Install frontend dependencies
        working-directory: frontend-stem
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend-stem
        run: npm run build
