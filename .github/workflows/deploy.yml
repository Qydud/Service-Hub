name: Deploy ServiceHub

on:
  push:
    branches: [ Miras ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/servicehub
            git fetch origin Miras
            git checkout origin/Miras -- backend-stem/
            git checkout origin/Miras -- frontend-stem/
            git checkout origin/Miras -- docker-compose.yml
            docker compose build --no-cache frontend
            docker compose build backend
            docker compose up -d --no-deps --remove-orphans frontend backend
            docker image prune -f
