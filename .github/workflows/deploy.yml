name: Deploy ServiceHub

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ServiceHub
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.SERVICEHUB_DEPLOY_PATH }}"
            git fetch origin
            git checkout --force origin/${{ github.ref_name }} -- backend-stem frontend-stem docker-compose.yml
            docker compose build --no-cache frontend
            docker compose build backend
            docker compose up -d --no-deps --remove-orphans frontend backend
            docker image prune -f
